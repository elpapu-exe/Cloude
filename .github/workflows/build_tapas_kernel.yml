name: Build Custom Kernel (Tapas / Topaz GKI 5.15)

on:
  workflow_dispatch:
    inputs:
      kernel_name:
        description: 'Nombre personalizado del kernel (LOCALVERSION)'
        required: true
        default: 'CloudeOpt-Tapas'
      kprofiles_default:
        description: 'Modo inicial de KProfiles (2=Balanced Calle, 3=Performance Libre)'
        type: choice
        default: '2'
        options:
          - '2'
          - '3'
      enable_thinlto:
        description: 'Usar ThinLTO (compila en ~15-20 min; desactivar para Full LTO)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: tapas-custom-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TAPAS_BUILD_CONTAINER: tapas-kernel-${{ github.run_id }}-${{ github.run_attempt }}
      TAPAS_BUILD_IMAGE: debian:13-slim@sha256:1e1a22175fbf1b32157ddaf0219e1db4e5401fab2b94ed285add64d18587cd2d
      CHATGPT_JOBS: '4'
      CHATGPT_CI_MIN_FREE_GIB: '10'

    steps:
      - name: Liberar espacio en disco y crear swap para superar preflight de 36 GiB
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true

          SWAP_GIB=26
          if [ "${{ inputs.enable_thinlto }}" != "true" ]; then
            SWAP_GIB=28
            echo "CHATGPT_JOBS=2" >> "$GITHUB_ENV"
          fi

          AVAIL_MNT=$(df -BG --output=avail /mnt 2>/dev/null | tail -n 1 | tr -dc '0-9')
          AVAIL_ROOT=$(df -BG --output=avail / 2>/dev/null | tail -n 1 | tr -dc '0-9')
          if [ -n "$AVAIL_MNT" ] && [ "$AVAIL_MNT" -ge $((SWAP_GIB + 4)) ]; then
            SWAPFILE="/mnt/tapas_swapfile"
          elif [ -n "$AVAIL_ROOT" ] && [ "$AVAIL_ROOT" -ge $((SWAP_GIB + 12)) ]; then
            SWAPFILE="/tapas_swapfile"
          else
            echo "::error::Espacio insuficiente para crear ${SWAP_GIB}G de swap (/mnt=${AVAIL_MNT}G, /=${AVAIL_ROOT}G)"
            df -h
            exit 1
          fi

          echo "Creando swapfile de ${SWAP_GIB}G en $SWAPFILE..."
          sudo fallocate -l "${SWAP_GIB}G" "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=$((SWAP_GIB * 1024)) status=none
          sudo chmod 600 "$SWAPFILE"
          sudo mkswap "$SWAPFILE"
          sudo swapon "$SWAPFILE"
          echo "TAPAS_SWAPFILE=$SWAPFILE" >> "$GITHUB_ENV"
          free -h
          df -h

      - name: Clonar archivos de construccion de elpapu-exe/Cloude
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            /.github/
            /ak3_tapas/
            /config/
            /docs/
            /installer/
            /patches/
            /scripts/
            /tests/
            /README.md
            /STATUS.md
            /.gitattributes
            /.gitignore
          sparse-checkout-cone-mode: false

      - name: Iniciar contenedor de compilacion verificado (Debian 13)
        run: |
          mkdir -p logs
          docker run --rm --detach --init --name "$TAPAS_BUILD_CONTAINER" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --workdir /work \
            --env CHATGPT_JOBS \
            --env CHATGPT_CI_MIN_FREE_GIB \
            "$TAPAS_BUILD_IMAGE" sleep infinity

      - name: Preparar fuentes pineadas (Zepharo R10 d246c8c + ReSukiSU + SUSFS + Baseband-guard)
        run: |
          set -o pipefail
          docker exec "$TAPAS_BUILD_CONTAINER" \
            bash scripts/ci-build-in-container.sh setup 2>&1 | tee logs/tapas-setup.log

      - name: Aplicar perfil Tapas 60Hz (MGLRU + ZRAM lz4kd + SSG + BBRv3 + Calle) y compilar Image
        env:
          INPUT_KNAME: ${{ inputs.kernel_name }}
          INPUT_KP_MODE: ${{ inputs.kprofiles_default }}
          INPUT_THINLTO: ${{ inputs.enable_thinlto }}
        run: |
          set -o pipefail
          docker exec \
            -e INPUT_KNAME \
            -e INPUT_KP_MODE \
            -e INPUT_THINLTO \
            -e CHATGPT_JOBS \
            "$TAPAS_BUILD_CONTAINER" bash -eu -c '
              echo "=== [1/4] Localizando fuentes, Clang 24 y herramientas host ==="

              # 1. Arbol de Linux parcheado
              KSRC=""
              if [ -f /work/.cache/linux/Makefile ]; then
                KSRC="/work/.cache/linux"
              else
                while IFS= read -r f; do
                  KSRC="${f%/arch/arm64/configs/unified_defconfig}"
                  break
                done < <(find /work /tmp /root /opt -maxdepth 8 -path "*/arch/arm64/configs/unified_defconfig" 2>/dev/null)
              fi
              if [ -z "$KSRC" ] || [ ! -f "$KSRC/Makefile" ]; then
                echo "::error::No se localizo el arbol fuente del kernel tras setup."
                ls -la /work /work/.cache 2>/dev/null || true
                exit 1
              fi

              # 2. Toolchain greenforce_clang (acepta symlinks: bin/clang -> clang-24)
              CLANG_BIN=""
              while IFS= read -r c; do
                case "$c" in
                  */bin/clang|*/bin/clang-[0-9]*)
                    CLANG_BIN="$(dirname "$c")"
                    break
                    ;;
                esac
              done < <(find /work /tmp /root /opt -maxdepth 8 \( -type f -o -type l \) \( -name "clang" -o -name "clang-[0-9]*" \) 2>/dev/null)

              if [ -z "$CLANG_BIN" ] || [ ! -x "$CLANG_BIN/clang" ]; then
                echo "::error::No se localizo greenforce_clang tras setup."
                find /work/.cache -maxdepth 4 2>/dev/null || true
                exit 1
              fi

              # 3. Directorio out/.config
              OUT_DIR="/work/out"
              if [ ! -f "$OUT_DIR/.config" ]; then
                while IFS= read -r cfg; do
                  OUT_DIR="$(dirname "$cfg")"
                  break
                done < <(find /work /tmp -maxdepth 6 -name ".config" 2>/dev/null)
              fi
              if [ ! -f "$OUT_DIR/.config" ]; then
                echo "::error::No se encontro .config en $OUT_DIR tras setup."
                exit 1
              fi

              # 4. Asegurar herramientas host (bc, bison, flex, m4, pahole, lz4, cpio) en el contenedor
              if ! command -v bison >/dev/null 2>&1 || ! command -v flex >/dev/null 2>&1 || ! command -v bc >/dev/null 2>&1 || ! command -v pahole >/dev/null 2>&1; then
                echo "Instalando herramientas host (bc, bison, flex, m4, pahole, lz4, cpio) en el contenedor..."
                DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
                  bc bison flex m4 pahole lz4 cpio libelf-dev libdw-dev libbpf-dev
              fi

              export PATH="$CLANG_BIN:$PATH"
              export ARCH=arm64
              export SUBARCH=arm64

              echo "KSRC      = $KSRC"
              echo "CLANG_BIN = $CLANG_BIN"
              echo "OUT_DIR   = $OUT_DIR"
              "$CLANG_BIN/clang" --version | head -n 2
              pahole --version || true

              echo "=== [2/4] Aplicando perfil Tapas 60Hz (MGLRU + ZRAM lz4kd + SSG + BBRv3 + Calle) ==="

              # Identidad del kernel
              "$KSRC/scripts/config" --file "$OUT_DIR/.config" --set-str CONFIG_LOCALVERSION "-${INPUT_KNAME}"
              "$KSRC/scripts/config" --file "$OUT_DIR/.config" --disable CONFIG_LOCALVERSION_AUTO

              # Multitarea real: MGLRU activo por defecto + ZRAM lz4kd
              "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_LRU_GEN
              "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_LRU_GEN_ENABLED
              "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_ZRAM
              if grep -rq "config CRYPTO_LZ4KD" "$KSRC/crypto" "$KSRC/drivers" 2>/dev/null; then
                "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_CRYPTO_LZ4KD
                "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_ZRAM_DEF_COMP_LZ4KD
                "$KSRC/scripts/config" --file "$OUT_DIR/.config" --set-str CONFIG_ZRAM_DEF_COMP "lz4kd"
              fi

              # Arranque rapido de apps: uclamp + I/O SSG
              "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_UCLAMP_TASK
              "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_UCLAMP_TASK_GROUP
              if grep -rq "config MQ_IOSCHED_SSG" "$KSRC/block" 2>/dev/null; then
                "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_MQ_IOSCHED_SSG
                "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_MQ_IOSCHED_SSG_CGROUP
              fi

              # Bateria en la calle & Deep Sleep (sin alterar ABI KMI)
              "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_WQ_POWER_EFFICIENT_DEFAULT
              "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_NO_HZ_IDLE

              # Red Cloud Gaming y 4G estable: BBRv3 / BBR + FQ por defecto
              "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_NET_SCH_FQ
              "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_DEFAULT_FQ
              if grep -rq "config TCP_CONG_BBR3" "$KSRC/net/ipv4" 2>/dev/null; then
                "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_TCP_CONG_BBR3
                "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_DEFAULT_BBR3
                "$KSRC/scripts/config" --file "$OUT_DIR/.config" --set-str CONFIG_DEFAULT_TCP_CONG "bbr3"
              elif grep -rq "config TCP_CONG_BBR" "$KSRC/net/ipv4" 2>/dev/null; then
                "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_TCP_CONG_BBR
                "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_DEFAULT_BBR
                "$KSRC/scripts/config" --file "$OUT_DIR/.config" --set-str CONFIG_DEFAULT_TCP_CONG "bbr"
              fi

              # Perfil inicial de KProfiles (2=Balanced Calle, 3=Performance)
              if grep -rq "config KPROFILES" "$KSRC/drivers" 2>/dev/null; then
                "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_KPROFILES
                if grep -rq "config DEFAULT_KP_MODE" "$KSRC/drivers" 2>/dev/null; then
                  "$KSRC/scripts/config" --file "$OUT_DIR/.config" --set-val CONFIG_DEFAULT_KP_MODE "$INPUT_KP_MODE"
                fi
              fi

              # ThinLTO para compilar rapido (~15-20 min) manteniendo rendimiento y compatibilidad
              if [ "$INPUT_THINLTO" = "true" ]; then
                "$KSRC/scripts/config" --file "$OUT_DIR/.config" --enable CONFIG_LTO_CLANG_THIN
                "$KSRC/scripts/config" --file "$OUT_DIR/.config" --disable CONFIG_LTO_CLANG_FULL
                "$KSRC/scripts/config" --file "$OUT_DIR/.config" --disable CONFIG_LTO_NONE
              fi

              # Evitar que un warning menor aborte la compilacion
              "$KSRC/scripts/config" --file "$OUT_DIR/.config" --disable CONFIG_WERROR

              MAKE_ARGS="O=$OUT_DIR ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip HOSTCC=gcc HOSTCXX=g++"

              echo "=== [3/4] Resolviendo dependencias con olddefconfig ==="
              make -C "$KSRC" $MAKE_ARGS olddefconfig

              echo "=== Resumen de simbolos activos ==="
              grep -E "CONFIG_(LOCALVERSION|LRU_GEN|ZRAM_DEF_COMP|MQ_IOSCHED_SSG|TCP_CONG_BBR|DEFAULT_TCP_CONG|DEFAULT_FQ|KPROFILES|DEFAULT_KP_MODE|KSU|SUSFS|BBG|WQ_POWER_EFFICIENT|LTO_CLANG)" "$OUT_DIR/.config" || true

              echo "=== [4/4] Compilando Image (-j${CHATGPT_JOBS}) ==="
              make -C "$KSRC" $MAKE_ARGS -j"${CHATGPT_JOBS}" Image

              cp -f "$OUT_DIR/arch/arm64/boot/Image" /work/tapas_Image
              cp -f "$OUT_DIR/.config" /work/logs/tapas_final.config
              ls -lh /work/tapas_Image
            ' 2>&1 | tee logs/tapas-build.log

      - name: Empaquetar ZIP flasheable con AnyKernel3 (Tapas / Topaz GKI Safe)
        id: package
        run: |
          if [ ! -s tapas_Image ]; then
            echo "::error::No se encontro tapas_Image tras la compilacion."
            exit 1
          fi

          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          rm -rf AnyKernel3/.git AnyKernel3/README.md AnyKernel3/modules AnyKernel3/patch AnyKernel3/ramdisk
          cp tapas_Image AnyKernel3/Image

          if [ -f ak3_tapas/anykernel.sh ]; then
            cp ak3_tapas/anykernel.sh AnyKernel3/anykernel.sh
            [ -f ak3_tapas/banner ] && cp ak3_tapas/banner AnyKernel3/banner
          elif [ -f installer/anykernel.sh ]; then
            cp installer/anykernel.sh AnyKernel3/anykernel.sh
          fi

          DATE_TAG=$(date +'%Y%m%d-%H%M')
          ZIP_NAME="${{ inputs.kernel_name }}-tapas-${DATE_TAG}.zip"
          (cd AnyKernel3 && zip -r9 "../$ZIP_NAME" * -x '*.git*' 'README.md')
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          sha256sum "$ZIP_NAME" > "${ZIP_NAME}.sha256"
          ls -lh "$ZIP_NAME"

      - name: Subir Kernel ZIP flasheable como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.zip_name }}
          path: |
            ${{ steps.package.outputs.zip_name }}
            ${{ steps.package.outputs.zip_name }}.sha256
          retention-days: 30

      - name: Guardar logs y configuracion final (tambien si falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tapas-build-logs-${{ github.run_id }}
          path: |
            logs/
          if-no-files-found: warn
          retention-days: 14

      - name: Detener contenedor y limpiar swap
        if: always()
        run: |
          if docker container inspect "$TAPAS_BUILD_CONTAINER" >/dev/null 2>&1; then
            docker rm --force "$TAPAS_BUILD_CONTAINER" || true
          fi
          if [ -n "${TAPAS_SWAPFILE:-}" ] && [ -f "$TAPAS_SWAPFILE" ]; then
            sudo swapoff "$TAPAS_SWAPFILE" || true
            sudo rm -f "$TAPAS_SWAPFILE" || true
          fi
