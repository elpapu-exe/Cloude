name: Build and deliver CPU response module

on:
  workflow_dispatch:
  push:
    branches: [chatgpt-kernel-download]
    paths:
      - modules/chatgpt-cpu-respuesta/**
      - scripts/package-cpu-respuesta-module.py
      - scripts/publish-cpu-respuesta-module.sh
      - tests/test_cpu_respuesta_module.py
      - tests/test_fluidez_module.py
      - scripts/chatgpt-kernel-logs.sh
      - tests/test_diagnostic.py
      - tests/test_diagnostic_runtime_details.py
      - .github/workflows/cpu-respuesta-module.yml

permissions:
  contents: read

concurrency:
  group: cpu-respuesta-module-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            modules/chatgpt-cpu-respuesta/
            scripts/package-cpu-respuesta-module.py
            scripts/publish-cpu-respuesta-module.sh
            tests/test_cpu_respuesta_module.py
            tests/test_fluidez_module.py
            scripts/chatgpt-kernel-logs.sh
            tests/test_diagnostic.py
            tests/test_diagnostic_runtime_details.py
            .github/workflows/cpu-respuesta-module.yml
            .gitignore
          sparse-checkout-cone-mode: false
      - name: Test real scripts, build ZIPs and verify contents and checksums
        run: python3 scripts/package-cpu-respuesta-module.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpu-respuesta-module-${{ github.sha }}
          path: dist/cpu-respuesta-module/
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/publish-cpu-respuesta-module.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cpu-respuesta-module-${{ github.sha }}
          path: dist/cpu-respuesta-module/
      - name: Upload draft, download and verify every file, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-cpu-respuesta-module.sh
