name: Build and deliver ChatGPT Kernel

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'JSON runner label(s); prefer a runner with at least 40 GiB physical RAM'
        required: true
        default: '"ubuntu-24.04"'
      swap_gib:
        description: 'Extra swap GiB, disposable GitHub-hosted runners only (0 disables)'
        required: true
        default: '32'
      publish:
        description: 'Publish an experimental GitHub prerelease after all audits'
        type: boolean
        default: true
  push:
    branches: [chatgpt-kernel-download]
    paths: [.github/build-request.json]

permissions:
  contents: read

concurrency:
  group: kernel-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner || vars.KERNEL_RUNNER_JSON || '"ubuntu-24.04"') }}
    timeout-minutes: 360
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CHATGPT_CI_SWAP_GIB: ${{ inputs.swap_gib || vars.KERNEL_SWAP_GIB || '32' }}
      CHATGPT_CI_CLEAN_SDKS: 'true'
      CHATGPT_JOBS: '5'
      # amd64 Debian 13-slim manifest verified with docker manifest inspect.
      CHATGPT_BUILD_IMAGE: debian:13-slim@sha256:1e1a22175fbf1b32157ddaf0219e1db4e5401fab2b94ed285add64d18587cd2d
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Read locked version
        id: version
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json,re
          version=json.load(open('config/sources.lock.json'))['version']
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]+', version)
          print(f'version={version}')
          PY
      - name: Check actual RAM, cgroup limits, swap and disk
        shell: bash
        run: bash scripts/ci-preflight.sh 2>&1 | tee logs-preflight.txt
      - name: Build, validate and audit corresponding sources
        shell: bash
        run: |
          mkdir -p logs
          cp logs-preflight.txt logs/preflight.log
          printf '%s\n' "$CHATGPT_BUILD_IMAGE" > logs/container-image.txt
          python3 scripts/ci-monitor.py > logs/resource-samples.jsonl &
          CHATGPT_MONITOR_PID=$!
          trap 'kill "$CHATGPT_MONITOR_PID" 2>/dev/null || true; wait "$CHATGPT_MONITOR_PID" 2>/dev/null || true' EXIT
          docker run --rm --init \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --workdir /work --env CHATGPT_JOBS \
            "$CHATGPT_BUILD_IMAGE" bash scripts/ci-build-in-container.sh \
            2>&1 | tee logs/ci-build.log
      - name: Keep audited deliverables for 90 days
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ChatGPTKernel-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
      - name: Keep diagnostics even when the build fails
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kernel-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            logs/
            logs-preflight.txt
            out/.config
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
      - name: Remove swap created for this run
        if: always() && env.CHATGPT_CREATED_SWAP != ''
        shell: bash
        run: |
          sudo swapoff "$CHATGPT_CREATED_SWAP"
          sudo rm -f "$CHATGPT_CREATED_SWAP"

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            scripts/ci-publish.sh
            docs/release-notes.md
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ChatGPTKernel-${{ needs.build.outputs.version }}-${{ github.sha }}
          path: dist
      - name: Upload draft, download and verify every asset, then publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          CHATGPT_VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: bash scripts/ci-publish.sh
